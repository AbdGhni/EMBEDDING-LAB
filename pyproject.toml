[project]
name = "embedding-lab"
version = "0.1.0"
description = "EMBEDDING LAB — embeddings spécialisés et agent sémantique à actions simulées"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.21",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Acquisition des données (lecture colonne par colonne des parquets distants)
data = [
    "huggingface_hub>=0.25",
    "openpyxl>=3.1",
    "pyarrow>=16",
]
# Entraînement et inférence des encodeurs (Colab ou machine avec GPU)
ml = [
    "torch>=2.3",
    "sentence-transformers>=3.0",
    "transformers>=4.44",
    "scikit-learn>=1.4",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embedding_lab"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "-q --doctest-modules"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
