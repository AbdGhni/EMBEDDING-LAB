# CI légère : schémas, tests unitaires, lint. Aucun entraînement, aucun téléchargement de corpus.
name: ci

on:
  push:
    branches: ["main", "el-*"]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Installer (verrou, sans extras ML)
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check src tests
      - name: Tests
        run: uv run pytest
